<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f7f4" />
    <meta name="description" content="Notes, ideas, and stories by Alisher Tursunov." />
    <title>Alisher Tursunov — Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="posts.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="#" aria-label="Alisher Tursunov home">at<span>.</span></a>
      <nav aria-label="Main navigation">
        <a href="#">Writing</a>
        <a href="mailto:hello@alishertursunov.com">Contact <span aria-hidden="true">↗</span></a>
      </nav>
    </header>

    <main id="main" class="page-shell">
      <section id="home-view" aria-labelledby="page-title">
        <div class="intro">
          <p class="eyebrow"><span class="status-dot"></span> A personal blog</p>
          <h1 id="page-title">Ideas, notes<br />&amp; <span>in-between.</span></h1>
          <p class="intro-copy">A place for things I’m learning, making, and thinking about. Thanks for being here.</p>
        </div>

        <section class="writing" aria-labelledby="writing-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">The journal</p>
              <h2 id="writing-title">Recent writing</h2>
            </div>
            <label class="search-wrap">
              <span class="visually-hidden">Search posts</span>
              <span aria-hidden="true">⌕</span>
              <input id="post-search" type="search" placeholder="Find a post" autocomplete="off" />
            </label>
          </div>
          <div id="post-list" class="post-list" aria-live="polite"></div>
          <p id="empty-state" class="empty-state" hidden>No posts found. Try another search.</p>
        </section>
      </section>

      <article id="article-view" class="article-view" hidden aria-live="polite"></article>
    </main>

    <footer class="site-footer">
      <span>© <span id="year"></span> Alisher Tursunov</span>
      <span>Made to be read slowly.</span>
    </footer>
  </body>
</html>
